extent.reporter.spark.start=true
extent.reporter.spark.out=reports/ExtentCucumberReport.html
screenshot.dir=reports/screenshots/
screenshot.rel.path=screenshots/

# Spark Reporter Basic Config

# Report Header & Browser Tab Title
extent.reporter.spark.config.document_title=TutorialsNinja Test Automation Report
extent.reporter.spark.config.report_name=BDD Automation Execution Results
extent.reporter.spark.config.theme=DARK

# View Order (Opens directly to the Dashboard or Test view)
extent.reporter.spark.vieworder=test,dashboard,category

# Offline & Visual Assets
extent.reporter.spark.config.offline=true
