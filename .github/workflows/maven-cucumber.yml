name: Selenium BDD Automation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      cucumber_tags:
        description: 'Cucumber tags expression (e.g. @Smoke, @Regression)'
        required: false
        default: '@Regression'
      browser:
        description: 'Browser for execution'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Test Project
        run: mvn clean test-compile -DargLine="--enable-native-access=ALL-UNNAMED"

      - name: Execute BDD Tests (Headless)
        run: |
          TAGS="${{ github.event.inputs.cucumber_tags || '@Regression' }}"
          BROWSER="${{ github.event.inputs.browser || 'chrome' }}"
          mvn test \
            -P bdd-suite \
            -Dbrowser=$BROWSER \
            -Dheadless=true \
            -DargLine="--enable-native-access=ALL-UNNAMED" \
            -Dcucumber.filter.tags="$TAGS"

      - name: Parse TestNG Execution Results
        if: always()
        id: parse_results
        run: |
          REPORT_FILE="target/surefire-reports/testng-results.xml"
          if [ -f "$REPORT_FILE" ]; then
            TOTAL=$(grep -o 'total="[0-9]*"' "$REPORT_FILE" | head -1 | grep -o '[0-9]*')
            PASSED=$(grep -o 'passed="[0-9]*"' "$REPORT_FILE" | head -1 | grep -o '[0-9]*')
            FAILED=$(grep -o 'failed="[0-9]*"' "$REPORT_FILE" | head -1 | grep -o '[0-9]*')
            SKIPPED=$(grep -o 'skipped="[0-9]*"' "$REPORT_FILE" | head -1 | grep -o '[0-9]*')
          else
            TOTAL="0"
            PASSED="0"
            FAILED="0"
            SKIPPED="0"
          fi

          echo "TOTAL_TESTS=${TOTAL:-0}" >> $GITHUB_ENV
          echo "PASSED_TESTS=${PASSED:-0}" >> $GITHUB_ENV
          echo "FAILED_TESTS=${FAILED:-0}" >> $GITHUB_ENV
          echo "SKIPPED_TESTS=${SKIPPED:-0}" >> $GITHUB_ENV

      - name: Archive Test Results & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-reports
          path: |
            reports/
            target/surefire-reports/
            logs/
          if-no-files-found: ignore

      - name: Send Email Notification with Inline Report Dashboard
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Execution Summary: Cucumber BDD Test Suite - ${{ job.status }} (Run #${{ github.run_number }})"
          to: ${{ secrets.MAIL_TO }}
          from: "Automated QA Test Runner <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 14px; color: #333333; margin: 0; padding: 20px; }
                .card { border: 1px solid #e1e4e8; border-radius: 8px; max-width: 650px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
                .banner { padding: 12px 18px; border-radius: 6px; font-weight: 600; font-size: 16px; margin-bottom: 20px; }
                .success-banner { background-color: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
                .failure-banner { background-color: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
                .stats-grid { display: flex; width: 100%; margin-bottom: 20px; }
                .stat-box { flex: 1; padding: 12px; margin: 0 4px; border-radius: 6px; text-align: center; }
                .stat-total { background-color: #f1f3f4; }
                .stat-passed { background-color: #e6f4ea; color: #137333; }
                .stat-failed { background-color: #fce8e6; color: #c5221f; }
                .stat-skipped { background-color: #fef7e0; color: #b06000; }
                .stat-val { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
                .stat-lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
                table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
                th, td { border: 1px solid #e1e4e8; padding: 10px 14px; text-align: left; }
                th { background-color: #f8f9fa; width: 35%; font-weight: 600; }
              </style>
            </head>
            <body>
              <div class="card">
                <div class="banner ${{ job.status == 'success' && 'success-banner' || 'failure-banner' }}">
                  Test Suite Status: ${{ job.status == 'success' && 'PASSED' || 'FAILED' }}
                </div>

                <table class="stats-grid" style="border: none; margin-bottom: 20px;">
                  <tr>
                    <td class="stat-box stat-total" style="text-align: center; border: 1px solid #dadce0;">
                      <div class="stat-val">${{ env.TOTAL_TESTS }}</div>
                      <div class="stat-lbl">Total</div>
                    </td>
                    <td class="stat-box stat-passed" style="text-align: center; border: 1px solid #ceead6;">
                      <div class="stat-val">${{ env.PASSED_TESTS }}</div>
                      <div class="stat-lbl">Passed</div>
                    </td>
                    <td class="stat-box stat-failed" style="text-align: center; border: 1px solid #fad2cf;">
                      <div class="stat-val">${{ env.FAILED_TESTS }}</div>
                      <div class="stat-lbl">Failed</div>
                    </td>
                    <td class="stat-box stat-skipped" style="text-align: center; border: 1px solid #feefc3;">
                      <div class="stat-val">${{ env.SKIPPED_TESTS }}</div>
                      <div class="stat-lbl">Skipped</div>
                    </td>
                  </tr>
                </table>

                <h3 style="margin-top: 0; font-size: 14px; border-bottom: 2px solid #f1f3f4; padding-bottom: 6px;">Execution Details</h3>
                <table>
                  <tr><th>Repository</th><td>${{ github.repository }}</td></tr>
                  <tr><th>Branch</th><td>${{ github.ref_name }}</td></tr>
                  <tr><th>Commit</th><td>${{ github.sha }}</td></tr>
                  <tr><th>Executed By</th><td>${{ github.actor }}</td></tr>
                  <tr><th>JDK Version</th><td>Java 25</td></tr>
                  <tr><th>Execution Mode</th><td>Headless CI</td></tr>
                </table>

                <p style="font-size: 12px; color: #5f6368; margin-top: 20px; line-height: 1.4;">
                  The complete interactive <b>ExtentCucumberReport.html</b> and <b>emailable-report.html</b> files are attached directly to this message for detailed scenario breakdown and step-level screenshots.
                </p>
              </div>
            </body>
            </html>
          attachments: |
            reports/ExtentCucumberReport.html
            target/surefire-reports/emailable-report.html